# =============================================================================
# Backgrounder — single source of truth for dependency versions (CLAUDE.md §10).
#
# IMPORTANT (CLAUDE.md §2 / §12): before bumping any version, web-search the
# latest stable. Versions in training data go stale fast. Stable only on `main`
# (no EAP / RC / Beta). The Kotlin pin is bounded above by SKIE's supported
# range — do not bump Kotlin past what SKIE supports.
# =============================================================================

[versions]

# --- Toolchain --------------------------------------------------------------
# Kotlin tracks the CLAUDE.md §2 floor (2.3.21). SKIE 0.10.12 added support for
# Kotlin 2.3.21, which is what unblocks this pin. CLAUDE.md §8: "If SKIE doesn't
# yet support a Kotlin version, we wait. Don't bump Kotlin past SKIE's supported
# range." So Kotlin and SKIE move in lockstep — never bump Kotlin past SKIE.
kotlin = "2.3.21"
agp = "9.2.0"                  # com.android.kotlin.multiplatform.library variant (CLAUDE.md §2).
skie = "0.10.12"               # Supports Kotlin 2.3.21.
kmmbridge = "1.2.1"            # XCFramework → GitHub Release asset → SPM (CLAUDE.md §9).
dokka = "2.2.0"                # Kotlin API doc generator; Dokka v2 plugin mode (the default since 2.1.0).
# vanniktech's gradle-maven-publish-plugin — publishes signed artifacts to the
# Sonatype Central Portal (central.sonatype.com). 0.36.0 is the first release
# that pins the JDK17 / Gradle 9 / AGP 9 floor we're already on, and the first
# to officially support com.android.kotlin.multiplatform.library publications.
# There is no official Sonatype-published Gradle plugin in 2026; this is the
# community-recommended path. The `mavenPublishing { }` block in
# backgrounder/build.gradle.kts owns the Central Portal target, POM metadata,
# and in-memory GPG signing configuration.
mavenPublish = "0.37.0"

# --- Android SDK ------------------------------------------------------------
android-compile-sdk = "36"
android-min-sdk = "30"         # arm64-v8a only (CLAUDE.md §1).
jvm-target = "21"              # CLAUDE.md §2.

# --- Apple deployment targets ----------------------------------------------
ios-deployment-target = "18.0"
macos-deployment-target = "15.0"

# --- kotlinx ----------------------------------------------------------------
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
kotlinx-atomicfu = "0.33.0"

# --- AndroidX ---------------------------------------------------------------
androidx-work = "2.12.0"
androidx-startup = "1.2.0"

# --- Other libraries --------------------------------------------------------
multiplatform-settings = "1.3.0"
kermit = "2.2.0"
# Network-reachability predicate for the WorkConstraints.networkRequired gate.
# `:reachable` is the production artifact (commonMain). `:reachable-testing`
# (commonTest) ships the upstream-blessed FakeReachability + withFakeReachability
# install/uninstall helper. 0.12.x collapsed the previous `Metering` enum
# (Unmetered / Metered / Constrained) into a single `isDataMetered: Boolean`
# on `ReachabilityStatus`, and renamed `reachable` → `isReachable`. 0.13.0 was an
# API-compatible bump (no source changes) built against Kotlin 2.3.21. 0.14.0 is
# the first release to publish a `jvm` slice for both `:reachable` and
# `:reachable-testing`, which is what lets this repo's `jvm()` target resolve its
# transitive reachable dependency — API-compatible with 0.13.0, no source changes.
reachable = "0.14.0"

# --- Testing ----------------------------------------------------------------
turbine = "1.2.1"

# --- Gradle plugin (:backgrounder-gradle-plugin) -------------------------
# ASM reads the compiled class files for `@BackgroundTaskId` constants. Gradle
# bundles its own ASM internally but does not expose it to plugins, so we
# declare it. 9.10.1 is the latest stable as of 2026-09.
asm = "9.10.1"

# --- Lint ------------------------------------------------------------------
ktlint = "1.8.0"               # The ktlint tool itself.
ktlintGradle = "14.2.0"        # The org.jlleitschuh.gradle.ktlint Gradle plugin.


[libraries]

# --- kotlinx ----------------------------------------------------------------
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "kotlinx-atomicfu" }

# --- AndroidX ---------------------------------------------------------------
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "androidx-work" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "androidx-startup" }

# --- Other ------------------------------------------------------------------
multiplatform-settings = { module = "com.russhwolf:multiplatform-settings", version.ref = "multiplatform-settings" }
multiplatform-settings-no-arg = { module = "com.russhwolf:multiplatform-settings-no-arg", version.ref = "multiplatform-settings" }
multiplatform-settings-coroutines = { module = "com.russhwolf:multiplatform-settings-coroutines", version.ref = "multiplatform-settings" }
multiplatform-settings-test = { module = "com.russhwolf:multiplatform-settings-test", version.ref = "multiplatform-settings" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
reachable = { module = "com.happycodelucky.reachable:reachable", version.ref = "reachable" }
reachable-testing = { module = "com.happycodelucky.reachable:reachable-testing", version.ref = "reachable" }

# --- Testing ----------------------------------------------------------------
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }


[plugins]

kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
skie = { id = "co.touchlab.skie", version.ref = "skie" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
# kmmbridge-github — applied in backgrounder/build.gradle.kts. Publishes the
# SKIE-enhanced Backgrounder.xcframework zip as a GitHub *Release* asset (public,
# unauthenticated — unlike GitHub Packages, which requires a PAT even to download
# from public repos) and regenerates the root Package.swift to reference it by
# URL + checksum. See the `kmmbridge { }` block in backgrounder/build.gradle.kts
# and the SPM steps in .github/workflows/release.yml.
# The kmmbridge-github artifact is a superset of the core kmmbridge plugin
# in 1.2.x — applying both produces a duplicate-extension error.
kmmbridge-github = { id = "co.touchlab.kmmbridge.github", version.ref = "kmmbridge" }
# Vanniktech Maven Publish — Maven Central Portal upload + GPG signing + sources/
# javadoc jars + POM-metadata DSL. See `mavenPublishing { }` in
# backgrounder/build.gradle.kts for the configuration.
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
